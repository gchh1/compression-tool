<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>注册 - WebCompress Pro</title>
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"></head>
<body>
<header class="app-header"><div class="header-inner"><a class="brand-logo" href="index.html">WebCompress Pro</a>
<nav class="main-navigation"><ul class="nav-menu"><li><a href="register.html" class="active">注册</a></li>
<li><a href="login.html">登录</a></li></ul></nav></div></header>
<main class="auth-page"><div class="auth-container">
<h1>创建新账户</h1><form class="auth-form"><div class="input-group">
<label>用户名</label><input type="text" required placeholder="选择用户名"></div>
<div class="input-group"><label>电子邮箱</label>
<input type="email" required placeholder="your@email.com"></div>
<div class="input-group"><label>密码</label>
<input type="password" required minlength="8" placeholder="至少8个字符"></div>
<div class="input-group"><label>确认密码</label>
<input type="password" required placeholder="再次输入密码"></div>
<button type="submit" class="auth-btn">注册</button><p class="auth-link">已有账户？<a href="login.html">立即登录</a></p>
</form></div></main><footer class="site-footer-main"><p>&copy; 2026 WebCompress</p></footer>
<script src="js/utils.js"></script></body></html>
