<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - WebCompress</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link"><span class="logo-text">WebCompress</span></a>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-item">首页</a></li>
                    <li><a href="about.html" class="nav-item">关于我们</a></li>
                    <li><a href="contact.html" class="nav-item active">联系我们</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title">联系我们</h1>
            <p class="page-desc">有任何问题或建议？欢迎与我们取得联系</p>
        </div>
    </section>

    <section class="contact-content">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-form-wrapper">
                    <form id="contactForm" class="contact-form">
                        <h3>发送消息</h3>
                        <div class="form-group">
                            <label for="name">姓名 *</label>
                            <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                        </div>
                        <div class="form-group">
                            <label for="email">电子邮箱 *</label>
                            <input type="email" id="email" name="email" required placeholder="example@email.com">
                        </div>
                        <div class="form-group">
                            <label for="subject">主题</label>
                            <select id="subject" name="subject">
                                <option value="">请选择主题</option>
                                <option value="general">一般咨询</option>
                                <option value="technical">技术问题</option>
                                <option value="bug">Bug 报告</option>
                                <option value="feature">功能建议</option>
                                <option value="cooperation">合作洽谈</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message">留言内容 *</label>
                            <textarea id="message" name="message" rows="6" required placeholder="请详细描述您的问题或建议..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">发送消息</button>
                    </form>
                </div>

                <div class="contact-info">
                    <div class="info-card">
                        <h4>项目地址</h4>
                        <p>数据结构课程设计 - 网页压缩系统</p>
                    </div>
                    <div class="info-card">
                        <h4>技术支持</h4>
                        <p>如有技术问题，请查看项目文档或提交 Issue。</p>
                    </div>
                    <div class="info-card">
                        <h4>相关链接</h4>
                        <ul>
                            <li><a href="#">GitHub 仓库</a></li>
                            <li><a href="#">API 文档</a></li>
                            <li><a href="#">使用指南</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 WebCompress Project. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
